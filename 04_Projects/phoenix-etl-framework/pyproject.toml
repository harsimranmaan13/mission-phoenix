[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-etl"
version = "0.1.0"
description = "Production-oriented ETL framework for the Mission Phoenix project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13,<3.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "black>=26.0,<27.0",
    "isort>=8.0,<9.0",
    "mypy>=2.0,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a running PostgreSQL database",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
